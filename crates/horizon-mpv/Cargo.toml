[package]
name = "horizon-mpv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "libmpv opened at run time from the game's version folder: checked by SHA-256, played through the software render API into RGBA frames (docs/native-libraries.md)"

[dependencies]
# libmpv is opened by its full path at run time; nothing links against it.
libloading = "0.8.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints]
workspace = true
